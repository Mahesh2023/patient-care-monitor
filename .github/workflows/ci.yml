name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: care
          POSTGRES_PASSWORD: care
          POSTGRES_DB: care_mm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U care" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests (SQLite)
        run: pytest
      - name: Migrations apply cleanly on Postgres
        env:
          DATABASE_URL: postgresql://care:care@localhost:5432/care_mm
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t care-mm:ci .
      - name: Boot smoke test
        run: |
          docker network create t
          docker run -d --name pg --network t -e POSTGRES_USER=care -e POSTGRES_PASSWORD=care -e POSTGRES_DB=care_mm postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U care && break; sleep 1; done
          docker run -d --name app --network t -p 8000:8000 \
            -e DATABASE_URL=postgresql://care:care@pg:5432/care_mm \
            -e JWT_SECRET=ci-secret-0123456789-0123456789-0123456789 \
            -e DATA_ENCRYPTION_KEY=ci-dek-0123456789-0123456789-0123456789 \
            -e ENABLE_LLM_REASONING=false care-mm:ci
          for i in $(seq 1 40); do curl -fsS localhost:8000/ready && exit 0; sleep 1; done
          docker logs app; exit 1
